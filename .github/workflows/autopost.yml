name: Autopost

# Публикует следующую карусель из очереди в Instagram и в Telegram.
# Запуск: каждый день в 08:37 по Москве cron на VPS вызывает workflow_dispatch
# (/usr/local/bin/veselovpro-autopost). Расписание GitHub не используем: оно опаздывает на часы. Очередь у каждой площадки своя:
# первая папка в carousels/ со статусом "ready" в post.json, ещё не вышедшая
# на этой площадке (нет published.json или published_tg.json).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || '17841462108620679' }}
      IG_HOST: ${{ vars.IG_HOST || 'graph.facebook.com' }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ vars.TG_CHAT_ID || '@veselovpro_marketing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instagram
        id: ig
        if: env.IG_ACCESS_TOKEN != ''
        continue-on-error: true
        run: python3 publisher/publish_ig.py next

      - name: Telegram
        id: tg
        if: env.TG_BOT_TOKEN != ''
        continue-on-error: true
        run: python3 publisher/publish_tg.py next

      - name: Save publish logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carousels/*/published*.json
          git diff --cached --quiet || { git commit -m "Autopost: ${{ steps.ig.outputs.folder }} ${{ steps.tg.outputs.folder }}"; git push; }

      - name: Fail if a platform failed
        if: steps.ig.outcome == 'failure' || steps.tg.outcome == 'failure'
        run: |
          echo "Instagram: ${{ steps.ig.outcome }}, Telegram: ${{ steps.tg.outcome }}"
          exit 1
